[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-text2sql"
version = "0.1.0"
description = "A fully local, evidence-driven agentic text-to-SQL system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Agentic Text-to-SQL contributors" }]
dependencies = [
  "faiss-cpu>=1.9,<2",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "numpy>=2,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pyyaml>=6.0,<7",
  "sqlglot>=27,<29",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
ui = [
  "fastapi>=0.115,<1",
  "pandas>=2.2,<4",
  "plotly>=5.24,<7",
  "streamlit>=1.39,<2",
  "streamlit-sortables==0.3.1",
  "uvicorn>=0.30,<1",
]
eval = []

[dependency-groups]
dev = [
  "hypothesis>=6.112,<7",
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
text2sql = "agentic_text2sql.interfaces.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_text2sql", "src/agentic_text2sql_eval", "datasets"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "ollama: requires a running local Ollama service and installed model",
  "olist: requires the locally built canonical Olist database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"apps/streamlit_app.py" = ["E501"] # CSS/design tokens are more readable unwrapped.

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentic_text2sql", "agentic_text2sql_eval"]
