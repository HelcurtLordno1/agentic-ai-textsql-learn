dataset_id: olist
version: 1
timezone: unknown
unsupported_concepts: [returns, refunds]
concepts:
  order_status:
    definition: Canonical Olist lifecycle value; preserve the English stored literal exactly.
    allowed_values: [approved, canceled, created, delivered, invoiced, processing, shipped, unavailable]
    canonical_filter_examples:
      delivered: "order_status = 'delivered'"
      canceled: "order_status = 'canceled'"
      unavailable: "order_status = 'unavailable'"
  product_revenue:
    definition: Sum item price at order-item grain for the population/status requested.
    canonical_expression: SUM(olist_order_items_dataset.price_cents)
    excludes: [freight, payment_value]
  freight:
    definition: Sum item freight, reported separately from product revenue unless GMV is requested.
    canonical_expression: SUM(olist_order_items_dataset.freight_value_cents)
  paid_value:
    definition: Sum payments pre-aggregated by order before joining order items.
    canonical_expression: order_payment_totals.paid_value_cents
  repeat_customer:
    definition: More than one distinct order for one customer_unique_id.
    identity_column: olist_customers_dataset.customer_unique_id
    canonical_relation: customer_order_facts
    canonical_filter: customer_order_facts.order_count > 1
    canonical_scalar: COUNT(*)
  multi_payment_method:
    definition: More than one distinct payment_type for an order.
    canonical_expression: order_payment_totals.distinct_payment_type_count > 1
  late_delivered:
    definition: Delivered timestamp is later than estimated delivery date; null deliveries excluded.
  cancellation_rate:
    definition: Canceled orders divided by an explicitly stated order population; not return rate.
  review_score:
    definition: Review aggregate after reducing review rows to order grain.
  order_count_by_payment_type:
    definition: Count distinct order_id values associated with each payment_type; an order may appear in more than one payment type.
  monthly_order_count:
    definition: Count distinct orders grouped by month of order_purchase_timestamp unless another order event is explicitly requested.
  unique_customer:
    definition: A real customer identity is customer_unique_id; customer_id identifies an order-scoped customer record.
  seller_state:
    definition: The seller location state is olist_sellers_dataset.seller_state.
  sold_item_count:
    definition: Count order-item rows at order-item grain; use seller_id when ranking sellers.
