version: 1
db_id: olist

# This is domain metadata, not benchmark gold. Rules describe stable business meaning and are
# validated against the introspected SQLite catalog before the runtime can use them.
entities:
  orders:
    aliases: [order, orders, đơn hàng]
    table: olist_orders_dataset
    identity_column: order_id
    row_grain: one row per order_id
  customers:
    aliases: [customer, customers, buyer, buyers, khách hàng, người mua]
    table: olist_customers_dataset
    identity_column: customer_unique_id
    row_grain: one row per customer_id with customer_unique_id identity
  sellers:
    aliases: [seller, sellers, merchant, merchants, người bán]
    table: olist_sellers_dataset
    identity_column: seller_id
    row_grain: one row per seller_id
  products:
    aliases: [product, products, sản phẩm, hàng hóa]
    table: olist_products_dataset
    identity_column: product_id
    row_grain: one row per product_id
  order_items:
    aliases: [order item, order items, item, items, dòng đơn hàng]
    table: olist_order_items_dataset
    row_grain: one row per order item
  payments:
    aliases: [payment, payments, thanh toán]
    table: olist_order_payments_dataset
    row_grain: one row per payment record
  reviews:
    aliases: [review, reviews, đánh giá]
    table: olist_order_reviews_dataset
    row_grain: one row per review record
  order_item_totals:
    aliases: [item total, item totals, item total row, order item totals, tổng sản phẩm theo đơn]
    table: order_item_totals
    identity_column: order_id
    row_grain: one row per order_id
  order_payment_totals:
    aliases: [payment total, payment totals, order payment totals, tổng thanh toán theo đơn]
    table: order_payment_totals
    identity_column: order_id
    row_grain: one row per order_id

metrics:
  product_revenue:
    aliases:
      - product revenue
      - merchandise revenue
      - total product price
      - doanh thu sản phẩm
      - doanh thu hàng hóa
      - tổng giá sản phẩm
    operator: SUM
    allowed_operators: [SUM, AVG, MIN, MAX]
    table: order_item_totals
    column: product_revenue_cents
    source_grain: one row per order_id
    alternate_sources:
      - table: olist_order_items_dataset
        column: price_cents
        source_grain: one row per order item
  freight:
    aliases: [freight, shipping fee, freight amount, phí vận chuyển]
    operator: SUM
    allowed_operators: [SUM, AVG, MIN, MAX]
    table: order_item_totals
    column: freight_cents
    source_grain: one row per order_id
  paid_value:
    aliases: [paid value, paid amount, payment value, total payment, tổng thanh toán, tổng tiền đã trả]
    operator: SUM
    allowed_operators: [SUM, AVG, MIN, MAX]
    table: order_payment_totals
    column: paid_value_cents
    source_grain: one row per order_id
  review_score:
    aliases: [average review score, average rating, điểm đánh giá trung bình]
    operator: AVG
    allowed_operators: [AVG, MIN, MAX]
    table: order_review_summary
    column: average_review_score
    source_grain: one row per order_id
    weight_column: review_row_count
  items_per_order:
    aliases:
      - average items per order
      - average item count per order
      - avg items per order
      - items per order
      - item count per order
      - số sản phẩm trung bình mỗi đơn hàng
      - trung bình số mặt hàng mỗi đơn
      - số item mỗi đơn
      - mỗi đơn có bao nhiêu item
    operator: AVG
    allowed_operators: [AVG]
    table: order_item_totals
    column: item_count
    source_grain: one row per order_id
  delivery_days:
    aliases:
      - average delivery days
      - average delivery time
      - thời gian giao hàng trung bình
      - số ngày giao hàng trung bình
    operator: AVG
    allowed_operators: [AVG, MIN, MAX]
    table: order_delivery_facts
    column: delivery_days
    source_grain: one row per order_id
  delay_days:
    aliases:
      - average delay days
      - average delivery delay
      - số ngày trễ trung bình
      - độ trễ giao hàng trung bình
    operator: AVG
    allowed_operators: [AVG, MIN, MAX]
    table: order_delivery_facts
    column: delay_days
    source_grain: one row per order_id
  payment_installments:
    aliases:
      - payment installments
      - number of payment installments
      - installment count
      - số kỳ thanh toán
    operator: AVG
    allowed_operators: [AVG, MIN, MAX]
    table: olist_order_payments_dataset
    column: payment_installments
    source_grain: one row per payment record

dimensions:
  english_product_category:
    aliases:
      - english product category
      - english product categories
      - english category
      - english categories
      - danh mục tiếng anh
    table: products_semantic
    column: product_category_name_english
    fallback_columns: [product_category_name]
    null_fallback: unknown
    source_grain: one row per product_id

joins:
  orders_item_totals:
    left_table: olist_orders_dataset
    left_column: order_id
    right_table: order_item_totals
    right_column: order_id
    cardinality: ONE_TO_ONE
  orders_payment_totals:
    left_table: olist_orders_dataset
    left_column: order_id
    right_table: order_payment_totals
    right_column: order_id
    cardinality: ONE_TO_ONE
  order_item_product:
    left_table: olist_order_items_dataset
    left_column: product_id
    right_table: products_semantic
    right_column: product_id
    cardinality: MANY_TO_ONE
  item_payment_totals:
    left_table: order_item_totals
    left_column: order_id
    right_table: order_payment_totals
    right_column: order_id
    cardinality: ONE_TO_ONE

filters:
  order_status:
    table: olist_orders_dataset
    column: order_status
    values:
      delivered:
        aliases: [delivered, completed delivery, giao thành công, đã giao]
        value: delivered
      canceled:
        aliases: [canceled, cancelled, canceled status, bị hủy, đã hủy]
        value: canceled
      unavailable:
        aliases: [unavailable, không có sẵn]
        value: unavailable

predicate_rules:
  product_category_null:
    aliases: [product category, category, danh mục]
    table: olist_products_dataset
    column: product_category_name
    kind: "null"
  review_score_equality:
    aliases: [review score, rating, điểm review, điểm đánh giá]
    table: olist_order_reviews_dataset
    column: review_score
    kind: numeric_equality
    minimum: 1
    maximum: 5
  delivery_timestamp_null:
    aliases:
      - delivery timestamp
      - delivered customer timestamp
      - delivered customer date
      - thời điểm giao hàng
      - ngày giao hàng
    table: olist_orders_dataset
    column: order_delivered_customer_date
    kind: "null"

derived:
  repeat_customer:
    aliases:
      - returning customer
      - returning customers
      - repeat customer
      - repeat customers
      - khách hàng quay lại
      - người mua lặp lại
    aggregate:
      operator: COUNT_ROWS
      table: customer_order_facts
      column: null
      evidence_id: semantic.derived.repeat_customer
      source_grain: one row per customer_unique_id
    predicates:
      - table: customer_order_facts
        column: order_count
        operator: GT
        value: 1
        evidence_id: semantic.derived.repeat_customer.order_count
  multi_payment_order:
    aliases:
      - orders with multiple payment methods
      - orders using multiple payment types
      - orders with more than one payment method
      - orders with more than one payment type
      - more than one payment type
      - đơn hàng có nhiều phương thức thanh toán
      - đơn dùng nhiều loại thanh toán
      - đơn dùng nhiều hơn một loại phương thức thanh toán
    aggregate:
      operator: COUNT_ROWS
      table: order_payment_totals
      column: null
      evidence_id: semantic.derived.multi_payment_order
      source_grain: one row per order_id
    predicates:
      - table: order_payment_totals
        column: distinct_payment_type_count
        operator: GT
        value: 1
        evidence_id: semantic.derived.multi_payment_order.distinct_payment_type_count
  late_delivery:
    aliases:
      - late deliveries
      - late delivered orders
      - orders delivered late
      - delivered late
      - giao hàng trễ
      - đơn giao trễ
    aggregate:
      operator: COUNT_ROWS
      table: order_delivery_facts
      column: null
      evidence_id: semantic.derived.late_delivery
      source_grain: one row per order_id
    predicates:
      - table: order_delivery_facts
        column: is_late_delivered
        operator: EQ
        value: 1
        evidence_id: semantic.derived.late_delivery.is_late_delivered
  customer_order_max:
    aliases:
      - maximum order count customer_unique_id
      - max orders customer_unique_id
      - số đơn hàng lớn nhất customer_unique_id
    aggregate:
      operator: MAX
      table: customer_order_facts
      column: order_count
      evidence_id: semantic.derived.customer_order_max
      source_grain: one row per customer_unique_id

frequency_rankings:
  payment_type_frequency:
    aliases:
      - payment types by row count
      - payment type and corresponding row count
      - payment type và số dòng tương ứng
      - loại thanh toán theo số dòng
    table: olist_order_payments_dataset
    dimension_column: payment_type
    source_grain: one row per payment record
  review_score_frequency:
    aliases:
      - most common review score
      - review score appears most often
      - điểm review nào xuất hiện nhiều nhất
      - điểm đánh giá xuất hiện nhiều nhất
    table: olist_order_reviews_dataset
    dimension_column: review_score
    source_grain: one row per review record
